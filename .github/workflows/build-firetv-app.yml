name: Build Fire TV app

on:
  push:
    branches: [main]
    paths:
      - 'firetv-app/**'
      - '.github/workflows/build-firetv-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build the app
        working-directory: firetv-app
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: jumbotron-firetv
          path: firetv-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
