<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jumbotron</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">JUMBOTRON</div>
    <div id="section" class="section"></div>
    <div id="pageCount" class="page-count"></div>
    <div id="status" class="status"></div>
    <div id="clock" class="clock"></div>
  </header>

  <main id="stage" class="stage full">
    <div id="grid" class="grid">
      <div class="message">Loading scores&hellip;</div>
    </div>
    <aside id="stats" class="stats"></aside>
  </main>

  <div id="alert" class="alert"></div>

  <footer class="ticker">
    <div class="ticker-tag">SCORES</div>
    <div class="ticker-window">
      <div id="strip" class="strip"></div>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
